[package]
name = "mero-blocks"
description = "Calimero voxel world state (block overrides + player presence)"
# THIS IS THE RELEASE VERSION. `cargo mero bundle` stamps it into the manifest
# and `.github/workflows/deploy-bundle.yml` publishes on any default-branch merge
# that changes this file and whose version the registry does not already have.
# Bumping it here IS the release; nothing else needs touching.
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Read by `cargo mero bundle` (core #3374): every field the node and the
# registry actually render now has a producer here, so nothing is hand-written
# into a manifest.json any more. `appVersion` is deliberately absent — the
# deploy workflow resolves it from the registry with `--bump patch`.
[package.metadata.calimero]
package = "com.calimero.meroblocks"
name = "Mero Blocks"
description = "Minecraft-style P2P voxel sandbox. The world is a Calimero context: seed + block-edit diff + player presence, no game server."
author = "Calimero"
# The desktop resolves a deep link (calimero://<slug>/… and
# https://links.calimero.network/<slug>/…) by this slug, so it MUST stay equal
# to the package id the app's invite links carry.
slug = "com.calimero.meroblocks"
icon = "../app/public/icon-512.png"
tags = ["game", "sandbox", "multiplayer"]
github = "https://github.com/calimero-network/mero-blocks"
min-runtime-version = "0.1.0"
frontend = "https://mero-blocks.vercel.app/"

[dependencies]
borsh = "1.6.1"
borsh-derive = "1.6.1"
bs58 = "0.5.1"
# SDK crates are not on crates.io past rc.5 — must be git tag deps, and all
# three must share the exact same tag (workspace version at the tag is 0.0.0).
# Pin a real release tag, never `branch = "master"`: master rides unreleased
# protocol work against nodes that run the release, and `latest` does not exist
# on the remote (it only ever resolves from a warm cargo cache).
calimero-sdk = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20" }
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20" }
calimero-storage-macros = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20" }

[dev-dependencies]
# "testing" enables the native mock host (TestHost) for `cargo test`
calimero-storage = { git = "https://github.com/calimero-network/core.git", tag = "0.11.0-rc.20", features = ["testing"] }

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
